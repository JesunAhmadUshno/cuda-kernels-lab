name: Pages

# Builds the live dashboard in site/ from the committed level-*/results*.json files and the
# level write-ups, and publishes it to GitHub Pages at https://jesunahmadushno.github.io/cuda-kernels-lab/.
# This replaces the legacy branch build of docs/index.md (a static summary page, not an app).
# docs/index.md stays in the repo. Pages must be switched to build_type=workflow for this to deploy.
on:
  push:
    branches: [main]
    paths: ['site/**', 'level-*/results*.json', 'level-*/README.md', 'level-2-build/DEBUG-SESSION.md', 'level-3-deep/cuda/ANALYSIS.md', 'README.md', 'REPORT.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
