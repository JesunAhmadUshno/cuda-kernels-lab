name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scaffold smoke test
        run: python tests/test_smoke.py
      - name: Level 1 Learn unit tests
        run: python -m unittest tests.test_learn_kernels -v
      - name: Level 1 Learn runner
        run: python level-1-learn/run_learn.py
      - name: C++ bench tool compile and self check (g++ on ubuntu-latest)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra level-1-learn/cpp/bench_tool.cpp -o /tmp/bench_tool
          /tmp/bench_tool
      - name: Level 2 Build unit tests
        run: python -m unittest tests.test_build_kernels -v
      - name: Level 2 Build runner
        run: python level-2-build/run_build.py
      - name: Level 2 C++ tests compile and run (g++ on ubuntu-latest)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra level-2-build/cpp/tests.cpp -o /tmp/cpp_tests
          /tmp/cpp_tests
          g++ -std=c++17 -fsanitize=address,undefined -g level-2-build/cpp/tool.cpp -o /tmp/tool_asan
          /tmp/tool_asan
      - name: Level 3 Deep unit tests
        run: python -m unittest tests.test_deep_kernels -v
      - name: Level 3 Deep runner
        run: python level-3-deep/run_deep.py
      - name: Level 3 C++ Deep tests compile and run (g++ on ubuntu-latest)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra level-3-deep/cpp/tests_deep.cpp -o /tmp/tests_deep -pthread
          /tmp/tests_deep
          g++ -std=c++17 -fsanitize=address,undefined -g level-3-deep/cpp/deep_tool.cpp -o /tmp/deep_asan -pthread
          /tmp/deep_asan
